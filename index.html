<!DOCTYPE html>

<title>Fabi's Grill — Pedido</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    touch-action: pan-y;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  :root {
    --marrom: #8b5a2b; --marrom-escuro: #5c3a1a; --dourado: #c8873a;
    --creme: #f5f0e6; --creme-escuro: #e8dfd0;
    --preto: #1a1a1a; --preto-suave: #2a2a2a;
    --verde: #16a34a; --verde-claro: #dcfce7; --verde-escuro: #15803d;
    --vermelho: #dc2626;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: var(--creme); color: var(--preto);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, var(--preto) 0%, var(--marrom-escuro) 100%);
    padding: 14px 20px; box-shadow: 0 3px 12px rgba(0,0,0,.35);
    flex-shrink: 0; border-bottom: 3px solid var(--dourado);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; top: -60px; right: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, var(--dourado) 0%, transparent 70%);
    opacity: .25; border-radius: 50%; pointer-events: none;
  }
  header .logo-fabis {
    max-height: 72px; max-width: 100%; width: auto; height: auto;
    display: block; filter: drop-shadow(0 3px 10px rgba(0,0,0,.5));
    position: relative; z-index: 1;
  }
  @media (max-width: 480px) { header .logo-fabis { max-height: 56px; } }

  .sync-status {
    position: fixed; top: 16px; right: 16px;
    font-size: .75rem; font-weight: 700;
    padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
    z-index: 100; transition: opacity .3s; color: #fff;
  }
  .sync-status.online { background: var(--verde); }
  .sync-status.saving { background: var(--dourado); }
  .sync-status.offline { background: var(--vermelho); }
  .sync-status.oculto { opacity: 0; }

  .tabs {
    display: flex; gap: 6px; padding: 12px 14px;
    background: var(--preto-suave); border-bottom: 3px solid var(--dourado);
    overflow-x: auto; flex-shrink: 0; scrollbar-width: thin;
  }
  .tabs::-webkit-scrollbar { height: 5px; }
  .tabs::-webkit-scrollbar-thumb { background: var(--marrom); border-radius: 3px; }

  .tab {
    flex-shrink: 0; padding: 9px 16px; border-radius: 24px;
    border: 2px solid var(--marrom); background: transparent;
    color: var(--creme-escuro); font-size: .84rem; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: all .2s;
  }
  .tab:hover { background: rgba(200,135,58,.15); border-color: var(--dourado); }
  .tab.ativa {
    background: linear-gradient(135deg, var(--dourado), var(--marrom));
    color: var(--preto); border-color: var(--creme);
    box-shadow: 0 2px 8px rgba(200,135,58,.5); font-weight: 800;
  }
  .tab .badge {
    display: inline-block; background: var(--verde); color: #fff;
    font-size: .7rem; font-weight: 800; padding: 2px 8px;
    border-radius: 999px; margin-left: 6px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.3);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .tab.ativa .badge { background: var(--verde); color: #fff; box-shadow: 0 0 0 2px var(--creme); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px;
    background: var(--creme); border-bottom: 2px solid var(--creme-escuro);
    flex-shrink: 0;
  }
  .toolbar input[type="search"] {
    flex: 1; min-width: 160px; padding: 10px 14px;
    border: 2px solid var(--creme-escuro); border-radius: 10px;
    font-size: .95rem; background: #fff; outline: none; color: var(--preto);
    -webkit-user-select: text; user-select: text;
  }
  .toolbar input[type="search"]::placeholder { color: #a89b88; }
  .toolbar input[type="search"]:focus { border-color: var(--marrom); }
  .toolbar button {
    padding: 10px 16px; border: none; border-radius: 10px;
    font-size: .9rem; font-weight: 700; cursor: pointer;
    background: var(--creme-escuro); color: var(--marrom-escuro);
  }
  .toolbar button:hover { background: #ddd0ba; }
  .toolbar button.danger { background: var(--preto); color: var(--creme); }
  .toolbar button.danger:hover { background: #333; }

  main { flex: 1; padding: 14px 16px 30px; overflow-y: auto; }

  .item {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px solid var(--creme-escuro);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
    transition: all .15s;
  }
  .item.selecionado {
    border-color: var(--verde);
    background: linear-gradient(to right, #f0fdf4, #dcfce7);
    box-shadow: 0 2px 10px rgba(22,163,74,.2);
  }
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: 700; font-size: .96rem; color: var(--preto); }
  .item.selecionado .nome { color: var(--verde-escuro); }
  .item .detalhe {
    font-size: .76rem; color: #8a7d68; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .tag-box {
    display: inline-block; background: var(--dourado); color: var(--preto);
    font-size: .66rem; font-weight: 800; padding: 1px 7px;
    border-radius: 4px; margin-left: 6px; vertical-align: middle;
  }
  .check {
    width: 28px; height: 28px; border-radius: 8px;
    border: 2.5px solid var(--creme-escuro);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; font-size: 1rem;
    color: transparent; background: #fff; transition: all .15s;
  }
  .item.selecionado .check {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border-color: var(--verde-escuro); color: #fff;
  }
  .qty { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .qty button {
    width: 34px; height: 34px; border-radius: 9px;
    border: 2px solid var(--creme-escuro); background: var(--creme);
    font-size: 1.15rem; font-weight: 800; color: var(--marrom-escuro);
    cursor: pointer;
  }
  .qty button:hover { background: var(--dourado); border-color: var(--marrom); color: var(--preto); }
  .qty input {
    width: 50px; text-align: center; padding: 7px 4px;
    border: 2px solid var(--creme-escuro); border-radius: 9px;
    font-size: 1rem; font-weight: 800; color: var(--marrom-escuro);
    background: #fff; -webkit-user-select: text; user-select: text;
  }
  .qty input:focus { outline: none; border-color: var(--marrom); }
  .item.selecionado .qty input { border-color: var(--verde); background: #f0fdf4; color: var(--verde-escuro); }
  .item.selecionado .qty button { border-color: var(--verde); background: var(--verde-claro); color: var(--verde-escuro); }
  .item.selecionado .qty button:hover { background: #22c55e; color: #fff; border-color: var(--verde-escuro); }

  .vazio { text-align: center; color: #a89b88; padding: 50px 20px; font-size: .95rem; }

  footer {
    background: linear-gradient(135deg, var(--preto) 0%, var(--marrom-escuro) 100%);
    color: var(--creme); padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 -3px 12px rgba(0,0,0,.3); flex-shrink: 0;
    border-top: 3px solid var(--dourado);
  }
  footer .resumo { flex: 1; font-size: .9rem; }
  footer .resumo strong { font-size: 1.2rem; color: var(--verde); font-weight: 900; }
  footer button {
    padding: 13px 22px; border: 2px solid var(--creme); border-radius: 12px;
    font-size: 1rem; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, var(--dourado), var(--marrom));
    color: var(--creme); text-shadow: 1px 1px 0 rgba(0,0,0,.3);
  }
  footer button:hover { background: linear-gradient(135deg, #d9993f, #a06a35); }
  footer button:disabled { background: #4a4a4a; border-color: #666; color: #999; cursor: not-allowed; text-shadow: none; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(26,26,26,.75);
    display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal-bg.aberto { display: flex; }
  .modal {
    background: var(--creme); border-radius: 18px;
    max-width: 560px; width: 100%; max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); border: 3px solid var(--marrom);
  }
  .modal header {
    background: linear-gradient(135deg, var(--preto) 0%, var(--marrom-escuro) 100%);
    border-bottom: 3px solid var(--dourado);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 16px;
  }
  .modal header .logo-fabis { max-height: 48px; }
  .modal header .subtitulo {
    margin: 8px 0 0; font-size: .72rem; font-weight: 700;
    letter-spacing: 3px; color: var(--dourado); text-transform: uppercase;
  }
  .modal .conteudo { padding: 18px; overflow: auto; }
  .modal pre {
    background: #fff; padding: 14px; border-radius: 10px;
    white-space: pre-wrap; font-size: .93rem; line-height: 1.65;
    font-family: 'Segoe UI', system-ui, sans-serif; margin: 0;
    border: 2px solid var(--creme-escuro); color: var(--preto);
    -webkit-user-select: text; user-select: text;
  }
  .modal .acoes {
    padding: 14px 18px; display: flex; gap: 8px;
    justify-content: flex-end; border-top: 2px solid var(--creme-escuro);
    flex-wrap: wrap; background: var(--creme);
  }
  .modal .acoes button {
    padding: 11px 18px; border-radius: 10px; border: none;
    font-size: .95rem; cursor: pointer; font-weight: 700;
  }
  .modal .acoes .fechar { background: var(--creme-escuro); color: var(--marrom-escuro); }
  .modal .acoes .copiar {
    background: linear-gradient(135deg, var(--dourado), var(--marrom));
    color: var(--creme); text-shadow: 1px 1px 0 rgba(0,0,0,.3);
  }
  .modal .acoes .whatsapp { background: #25D366; color: #fff; }
</style>
</head>
<body>

<div class="sync-status oculto" id="syncStatus">Sincronizado</div>

<header>

<div class="modal-bg" id="modalBg">

/* Mapa id → categoria */
const CATEGORIA_POR_ID = {};
[
  "mushrooms","pumpkin","aubergine","carrots","green_lime","mixed_peppers","onions",
  "fresh_parsley","fresh_coriander","tomatoes","sweet_corn","passion_fruit",
  "spring_onion","cabbage","fresh_orange","fresh_pineapple","iceberg","plum_tomatoes",
  "legumes_assar","mint","basil","courgette"
].forEach(id => CATEGORIA_POR_ID[id] = "vegetais");

[
  "chicken_filet","cheddar_slice","burger","ham","bacon","striploin","contra_filet",
  "pork_loin","top_rib","tilapia","eggs"
].forEach(id => CATEGORIA_POR_ID[id] = "carnes");

[
  "cheese_unit","peeled_garlic","fresh_cream","tofu","mayo","bread_crumbs","olive_oil",
  "ketchup","vinegar","odmilus","puck","paprika","oregano","colmans_mustard","sea_salt",

].forEach(id => CATEGORIA_POR_ID[id] = "mercearia");

[
  "skinny_chips","brioche_bun","tilda_rice","griffin_potatoes"
].forEach(id => CATEGORIA_POR_ID[id] = "paes");

[
  "coke_zero_330","coke_zero_500","coke_cola_330","coke_cola_500","fanta_orange_330",
  "seven_up_330","sparkling_water","still_water","water_5l"
].forEach(id => CATEGORIA_POR_ID[id] = "bebidas");

[
  "gloves","blue_paper","washing_up","bleach","black_bag_bin","yellow_sponge","napkins"
].forEach(id => CATEGORIA_POR_ID[id] = "limpeza");

[
  "c500","c650","8oz","4oz","3lb","fish_chips_box","white_paper","sos_bags"
].forEach(id => CATEGORIA_POR_ID[id] = "embalagem");

/* ===== ESTADO ===== */
let estado = {};
let filtro = "";
let abaAtiva = "vegetais";
let primeiraCarga = true;

const syncEl = document.getElementById("syncStatus");
let syncTimeout = null;

function mostrarStatus(texto, tipo) {
  syncEl.textContent = texto;
  syncEl.className = "sync-status " + tipo;
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => syncEl.classList.add("oculto"), 1500);
}

onValue(pedidoRef, (snapshot) => {
  const dados = snapshot.val();
  const novoEstado = {};
  if (dados && typeof dados === "object") {
    Object.keys(dados).forEach(k => {
      /* Só aceita ids que existam na lista */
      if (ITENS.some(i => i.id === k) && dados[k] > 0) {
        novoEstado[k] = dados[k];
      }
    });
  }
  estado = novoEstado;
  render();
  if (primeiraCarga) {
    primeiraCarga = false;
  } else {
    mostrarStatus("🔄 Atualizado", "online");
  }
});

async function guardarNaCloud() {
  mostrarStatus("💾 Guardando...", "saving");
  try {
    await set(pedidoRef, estado);
    mostrarStatus("✅ Sincronizado", "online");
  } catch (e) {
    console.error("Erro ao guardar:", e);
    mostrarStatus("⚠️ Erro — tenta de novo", "offline");
  }
}

const tabsEl = document.getElementById("tabs");

function renderTabs() {
  tabsEl.innerHTML = "";
  CATEGORIAS.forEach(cat => {
    const idsCat = Object.keys(CATEGORIA_POR_ID).filter(id => CATEGORIA_POR_ID[id] === cat.id);
    const selecionados = idsCat.reduce((s, id) => s + (estado[id] || 0), 0);
    const btn = document.createElement("button");
    btn.className = "tab" + (abaAtiva === cat.id ? " ativa" : "");
    btn.innerHTML = cat.nome + (selecionados > 0 ? `<span class="badge">${selecionados}</span>` : "");
    btn.onclick = () => {
      abaAtiva = cat.id; filtro = "";
      document.getElementById("busca").value = "";
      render();
    };
    tabsEl.appendChild(btn);
  });
}

const listaEl = document.getElementById("lista");
const totalEl = document.getElementById("totalItens");
const btnVer = document.getElementById("btnVerPedido");

function render() {
  renderTabs();
  listaEl.innerHTML = "";
  const itensAba = ITENS.filter(i => CATEGORIA_POR_ID[i.id] === abaAtiva);
  const itensFiltrados = itensAba.filter(i =>
    (i.nome + " " + (i.detalhe || "")).toLowerCase().includes(filtro)
  );

  if (itensFiltrados.length === 0) {
    const v = document.createElement("div");
    v.className = "vazio";
    v.textContent = "Nenhum item nesta categoria.";
    listaEl.appendChild(v);
  } else {
    itensFiltrados.forEach(item => renderItem(item, listaEl));
  }
  atualizarTotal();
}

function renderItem(item, container) {
  const qtd = estado[item.id] || 0;
  const div = document.createElement("div");
  div.className = "item" + (qtd > 0 ? " selecionado" : "");

  const check = document.createElement("div");
  check.className = "check";
  check.textContent = "✓";
  check.onclick = () => toggleItem(item.id);

  const info = document.createElement("div");
  info.className = "info";
  const tagBox = item.tag ? `<span class="tag-box">${item.tag}</span>` : "";
  info.innerHTML = `<div class="nome">${item.nome}${tagBox}</div>` +
                   (item.detalhe ? `<div class="detalhe">${item.detalhe}</div>` : "");
  info.onclick = () => toggleItem(item.id);

  const qty = document.createElement("div");
  qty.className = "qty";
  const btnMenos = document.createElement("button");
  btnMenos.textContent = "−";
  btnMenos.onclick = (e) => { e.stopPropagation(); alterarQtd(item.id, -1); };
  const input = document.createElement("input");
  input.type = "number"; input.min = "0"; input.value = qtd;
  input.onclick = (e) => e.stopPropagation();
  input.onchange = (e) => {
    const v = Math.max(0, parseInt(e.target.value) || 0);
    if (v > 0) estado[item.id] = v; else delete estado[item.id];
    guardarNaCloud(); render();
  };
  const btnMais = document.createElement("button");
  btnMais.textContent = "+";
  btnMais.onclick = (e) => { e.stopPropagation(); alterarQtd(item.id, +1); };

  qty.appendChild(btnMenos); qty.appendChild(input); qty.appendChild(btnMais);
  div.appendChild(check); div.appendChild(info); div.appendChild(qty);
  container.appendChild(div);
}

function toggleItem(id) {
  if (estado[id] && estado[id] > 0) delete estado[id];
  else estado[id] = 1;
  guardarNaCloud(); render();
}

function alterarQtd(id, delta) {
  const atual = estado[id] || 0;
  const novo = Math.max(0, atual + delta);
  if (novo > 0) estado[id] = novo; else delete estado[id];
  guardarNaCloud(); render();
}

function atualizarTotal() {
  const total = Object.values(estado).reduce((a, b) => a + b, 0);
  totalEl.textContent = total;
  btnVer.disabled = total === 0;
}

function gerarTextoPedido() {
  const linhas = [];
  linhas.push("Hello Ercan, could you send it to Fabis Grill temple bar, ");
  linhas.push("");
  ITENS.forEach(item => {
    const qtd = estado[item.id] || 0;
    if (qtd > 0) linhas.push(`${qtd} ${item.nome} `);
  });
  linhas.push("");
  linhas.push("Thank you! 🙏");
  return linhas.join("\n");
}

document.getElementById("busca").addEventListener("input", (e) => {
  filtro = e.target.value.toLowerCase().trim();
  if (filtro) {
    listaEl.innerHTML = "";
    const resultados = ITENS.filter(i =>
      (i.nome + " " + (i.detalhe || "")).toLowerCase().includes(filtro)
    );
    if (resultados.length === 0) {
      const v = document.createElement("div");
      v.className = "vazio";
      v.textContent = "Nenhum item encontrado.";
      listaEl.appendChild(v);
    } else {
      resultados.forEach(item => renderItem(item, listaEl));
    }
    return;
  }
  render();
});

document.getElementById("btnLimpar").addEventListener("click", async () => {
  if (confirm("⚠️ Limpar TODOS os itens? Isto afeta todos os staff!")) {
    estado = {};
    await guardarNaCloud();
    render();
  }
});

const modalBg = document.getElementById("modalBg");
const textoPedido = document.getElementById("textoPedido");

document.getElementById("btnVerPedido").addEventListener("click", () => {
  textoPedido.textContent = gerarTextoPedido();
  modalBg.classList.add("aberto");
});
document.getElementById("btnFechar").addEventListener("click", () => modalBg.classList.remove("aberto"));
modalBg.addEventListener("click", (e) => { if (e.target === modalBg) modalBg.classList.remove("aberto"); });

document.getElementById("btnCopiar").addEventListener("click", async () => {
  const texto = gerarTextoPedido();
  try {
    await navigator.clipboard.writeText(texto);
    alert("Pedido copiado!");
  } catch {
    const range = document.createRange();
    range.selectNode(textoPedido);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
    alert("Pedido copiado!");
  }
});

document.getElementById("btnWhatsApp").addEventListener("click", () => {
  const texto = gerarTextoPedido();
  const textoCodificado = encodeURIComponent(texto);
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const url = isMobile ? `whatsapp://send?text=${textoCodificado}` : `https://wa.me/?text=${textoCodificado}`;
  window.open(url, "_blank");
});

/* ===== BLOQUEAR ZOOM ===== */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0' || e.key === '=')) e.preventDefault();
});
