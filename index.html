    border-radius: 50%;

    font-weight: 700;

    z-index: 100;
    transition: opacity .3s;
    color: #fff;

  .sync-status.saving { background: var(--dourado); }
  .sync-status.offline { background: var(--vermelho); }

function categoriaId(nome) {
  const n = nome.toLowerCase();
  if (/(coke|fanta|seven up|water|água)/.test(n)) return "bebidas";
  if (/(c500|c650|8oz|4oz|3lb|fish and chips|white paper for chips|S\.O\.S|carrier bags|napkins|guardanapos)/i.test(n)) return "embalagem";
  if (/(gloves|blue paper|washing|bleach|black bag bin|yellow sponge)/.test(n)) return "limpeza";
  if (/(mushroom|cogumelo|pumpkin|aubergine|beringela|carrot|cenoura|lime|lima|pepper|pimento|onion|cebola|parsley|salsa|coriander|coentros|garlic|alho|tomato|tomate|corn|milho|passion|maracujá|spring onion|cebolinha|cabbage|repolho|lettuce|alface|legumes|potato|batata|courgette|pineapple|abacaxi|orange|laranja)/.test(n)) return "vegetais";
  if (/(cheese|queijo|cream|natas|tofu|puck|mayo|maionese|ketchup|mustard|mostarda|vinegar|vinagre|oil|azeite|salt|sal|paprika|oregano|orégãos|mint|hortelã|basil|manjericão|bread crumbs|farinha|cassava)/.test(n)) return "mercearia";

  if (/(brioche|bun|pão|rice|arroz|chips|batata frita|tilda|fries|potatoes)/.test(n)) return "paes";
  return "outros";
}

/* =========================================================
   ESTADO GLOBAL (sincronizado com Firebase)
   ========================================================= */
let estado = {};
let filtro = "";
let abaAtiva = "vegetais";

/* =========================================================
   INDICADOR DE ESTADO
   ========================================================= */
const syncEl = document.getElementById("syncStatus");
let syncTimeout = null;

function mostrarStatus(texto, tipo) {
  syncEl.textContent = texto;
  syncEl.className = "sync-status " + tipo;
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    syncEl.classList.add("oculto");
  }, 1500);
}

/* =========================================================
   SINCRONIZAÇÃO COM FIREBASE
   ========================================================= */
onValue(pedidoRef, (snapshot) => {
  const dados = snapshot.val();
  const novoEstado = {};
  if (dados && typeof dados === "object") {
    Object.keys(dados).forEach(k => {
      if (ITENS.includes(k) && dados[k] > 0) {
        novoEstado[k] = dados[k];
      }
    });
  }
  estado = novoEstado;
  render();
  mostrarStatus("🔄 Atualizado", "online");
});

async function guardarNaCloud() {
  mostrarStatus("💾 Guardando...", "saving");
  try {
    await set(pedidoRef, estado);
    mostrarStatus("✅ Sincronizado", "online");
  } catch (e) {
    console.error("Erro ao guardar:", e);
    mostrarStatus("⚠️ Erro — tenta de novo", "offline");
  }
}

/* =========================================================
   RENDER DAS ABAS
   ========================================================= */
const tabsEl = document.getElementById("tabs");

function renderTabs() {
  tabsEl.innerHTML = "";
  CATEGORIAS.forEach(cat => {
    const itensCat = ITENS.filter(i => categoriaId(i) === cat.id);
    const selecionados = itensCat.reduce((s, i) => s + (estado[i] || 0), 0);

    const btn = document.createElement("button");
    btn.className = "tab" + (abaAtiva === cat.id ? " ativa" : "");
    btn.innerHTML = cat.nome +
      (selecionados > 0 ? `<span class="badge">${selecionados}</span>` : "");
    btn.onclick = () => {
      abaAtiva = cat.id;
      filtro = "";
      document.getElementById("busca").value = "";
      render();
    };
    tabsEl.appendChild(btn);
  });
}

/* =========================================================
   RENDER DA LISTA
   ========================================================= */
const listaEl = document.getElementById("lista");
const totalEl = document.getElementById("totalItens");
const btnVer = document.getElementById("btnVerPedido");

function render() {
  renderTabs();
  listaEl.innerHTML = "";

  const itensAba = ITENS.filter(i => categoriaId(i) === abaAtiva);
  const itensFiltrados = itensAba.filter(i =>
    i.toLowerCase().includes(filtro)
  );

  if (itensFiltrados.length === 0) {
    const v = document.createElement("div");
    v.className = "vazio";
    v.textContent = "Nenhum item nesta categoria.";
    listaEl.appendChild(v);
  } else {
    itensFiltrados.forEach(item => renderItem(item, listaEl));
  }

  atualizarTotal();
}

function renderItem(item, container) {
  const qtd = estado[item] || 0;
  const div = document.createElement("div");
  div.className = "item" + (qtd > 0 ? " selecionado" : "");

  const check = document.createElement("div");
  check.className = "check";
  check.textContent = "✓";
  check.onclick = () => toggleItem(item);

  const info = document.createElement("div");
  info.className = "info";
  const partes = item.split(" (");
  const nome = partes[0];
  const detalhe = partes[1] ? "(" + partes.slice(1).join(" (") : "";
  const tagBox = isBox(item) ? '<span class="tag-box">BOX</span>' : "";
  info.innerHTML = `<div class="nome">${nome}${tagBox}</div>` +
                   (detalhe ? `<div class="detalhe">${detalhe}</div>` : "");
  info.onclick = () => toggleItem(item);

  const qty = document.createElement("div");
  qty.className = "qty";
  const btnMenos = document.createElement("button");
  btnMenos.textContent = "−";
  btnMenos.onclick = (e) => { e.stopPropagation(); alterarQtd(item, -1); };
  const input = document.createElement("input");
  input.type = "number";
  input.min = "0";
  input.value = qtd;
  input.onclick = (e) => e.stopPropagation();
  input.onchange = (e) => {
    const v = Math.max(0, parseInt(e.target.value) || 0);
    if (v > 0) estado[item] = v;
    else delete estado[item];
    guardarNaCloud();
    render();
  };
  const btnMais = document.createElement("button");
  btnMais.textContent = "+";
  btnMais.onclick = (e) => { e.stopPropagation(); alterarQtd(item, +1); };

  qty.appendChild(btnMenos);
  qty.appendChild(input);
  qty.appendChild(btnMais);

  div.appendChild(check);
  div.appendChild(info);
  div.appendChild(qty);
  container.appendChild(div);
}

function toggleItem(item) {
  if (estado[item] && estado[item] > 0) delete estado[item];
  else estado[item] = 1;
  guardarNaCloud();
  render();
}

function alterarQtd(item, delta) {
  const atual = estado[item] || 0;
  const novo = Math.max(0, atual + delta);
  if (novo > 0) estado[item] = novo;
  else delete estado[item];
  guardarNaCloud();
  render();
}

function atualizarTotal() {
  const total = Object.values(estado).reduce((a, b) => a + b, 0);
  totalEl.textContent = total;
  btnVer.disabled = total === 0;
}

/* =========================================================
   GERAR TEXTO DO PEDIDO
   ========================================================= */
function gerarTextoPedido() {
  const linhas = [];
  linhas.push("Hello Ercan, could you send it to Fabis Grill temple bar, ");
  linhas.push("");

  ITENS.forEach(item => {
    const qtd = estado[item] || 0;
    if (qtd > 0) linhas.push(`${qtd} ${nomeCurto(item)} `);
  });

  linhas.push("");
  linhas.push("Thank you! 🙏");

  return linhas.join("\n");
}

/* =========================================================
   EVENTOS
   ========================================================= */
document.getElementById("busca").addEventListener("input", (e) => {
  filtro = e.target.value.toLowerCase().trim();
  if (filtro) {
    listaEl.innerHTML = "";
    const resultados = ITENS.filter(i => i.toLowerCase().includes(filtro));
    if (resultados.length === 0) {
      const v = document.createElement("div");
      v.className = "vazio";
      v.textContent = "Nenhum item encontrado.";
      listaEl.appendChild(v);
    } else {
      resultados.forEach(item => renderItem(item, listaEl));
    }
    return;
  }
  render();
});

document.getElementById("btnLimpar").addEventListener("click", async () => {
  if (confirm("⚠️ Limpar TODOS os itens? Isto afeta todos os staff!")) {
    estado = {};
    await guardarNaCloud();
    render();
  }
});

/* =========================================================
   MODAL / RESUMO
   ========================================================= */
const modalBg = document.getElementById("modalBg");
const textoPedido = document.getElementById("textoPedido");

document.getElementById("btnVerPedido").addEventListener("click", () => {
  textoPedido.textContent = gerarTextoPedido();
  modalBg.classList.add("aberto");
});

document.getElementById("btnFechar").addEventListener("click", () => {
  modalBg.classList.remove("aberto");
});

modalBg.addEventListener("click", (e) => {
  if (e.target === modalBg) modalBg.classList.remove("aberto");
});

document.getElementById("btnCopiar").addEventListener("click", async () => {
  const texto = gerarTextoPedido();
  try {
    await navigator.clipboard.writeText(texto);
    alert("Pedido copiado!");
  } catch {
    const range = document.createRange();
    range.selectNode(textoPedido);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
    alert("Pedido copiado!");
  }
});

document.getElementById("btnWhatsApp").addEventListener("click", () => {
  const texto = gerarTextoPedido();
  const textoCodificado = encodeURIComponent(texto);
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const url = isMobile
    ? `whatsapp://send?text=${textoCodificado}`
    : `https://wa.me/?text=${textoCodificado}`;
  window.open(url, "_blank");
});

/* =========================================================
   BLOQUEAR ZOOM
   ========================================================= */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener('wheel', (e) => {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0' || e.key === '=')) {
    e.preventDefault();
  }
});
